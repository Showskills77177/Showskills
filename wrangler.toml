# Cloudflare Pages — staging / preview SPA only (API + crons stay on Vercel).
# Dashboard (exact):
#   Production branch = staging
#   Build command = bash scripts/pages-build.sh
#   Output directory = dist
#   Build system = v3
#   SKIP_DEPENDENCY_INSTALL = 1
#   NODE_VERSION = 22.16.0
#   VERCEL_API_ORIGIN = https://<vercel-staging>.vercel.app
# Do NOT attach showskills.co.uk. See docs/DEPLOY-CLOUDFLARE.md.
name = "showskills-staging"
compatibility_date = "2025-07-01"
pages_build_output_dir = "dist"

# Set VERCEL_API_ORIGIN in the Pages dashboard (Preview + Production for this project)
# to your Vercel staging origin, e.g. https://your-app-staging.vercel.app (no trailing slash).
# Optional fallback when dashboard vars are missing (leave empty in repo):
# [vars]
# VERCEL_API_ORIGIN = ""
